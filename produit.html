<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RUN. — Produit</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header class="navbar">

    <a href="index.html" class="logo">
        RUN<span>.</span>
    </a>

    <nav class="nav-links">
        <a href="index.html#collection">Collection</a>
        <a href="index.html#categories">Catégories</a>
        <a href="index.html#marques">Marques</a>
    </nav>

    <a href="panier.html" class="cart-link">
        🛒
        <span id="cartCount">0</span>
    </a>

</header>


<main class="product-page">


    <a href="index.html#collection" class="back-link">
        ← Retour à la collection
    </a>


    <div class="product-detail">


        <!-- IMAGE -->

        <div class="product-detail-image">

            <img id="productImage"
                 src=""
                 alt="">

        </div>


        <!-- INFORMATIONS -->

        <div class="product-detail-info">

            <p class="product-brand"
               id="productBrand">
            </p>

            <h1 id="productName">
            </h1>

            <p class="product-price"
               id="productPrice">
            </p>


            <div class="detail-line"></div>


            <p class="product-description"
               id="productDescription">
            </p>


            <!-- POINTURES -->

            <div class="size-section">

                <div class="size-title">

                    <strong>
                        Choisir une pointure
                    </strong>

                    <span>
                        EU
                    </span>

                </div>


                <div class="sizes">

                    <button>39</button>
                    <button>40</button>
                    <button>41</button>
                    <button>42</button>
                    <button>43</button>
                    <button>44</button>
                    <button>45</button>

                </div>

            </div>


            <button class="buy-button"
                    id="addToCart">

                Ajouter au panier

                <span>→</span>

            </button>


            <div class="product-benefits">

                <div>
                    <span>01</span>
                    <p>
                        Livraison rapide
                    </p>
                </div>

                <div>
                    <span>02</span>
                    <p>
                        Retours sous 30 jours
                    </p>
                </div>

                <div>
                    <span>03</span>
                    <p>
                        Paiement sécurisé
                    </p>
                </div>

            </div>

        </div>

    </div>


    <!-- DESCRIPTION -->

    <section class="product-description-section">

        <div>

            <p class="section-label">
                À PROPOS DE LA PAIRE
            </p>

            <h2>
                Pensée pour courir.
            </h2>

        </div>

        <p id="longDescription">
        </p>

    </section>


</main>


<footer>

    <div class="footer-top">

        <div>

            <a href="index.html" class="logo footer-logo">
                RUN<span>.</span>
            </a>

            <p>
                Run your own way.
            </p>

        </div>

    </div>


    <div class="footer-bottom">

        <span>
            © 2026 RUN.
        </span>

        <span>
            Running / Performance / Lifestyle
        </span>

    </div>

</footer>


<script src="produit.js"></script>

</body>
</html>
